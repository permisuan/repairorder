services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
    # Port 8000 is mapped for local testing; NPM will use this to find the app
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

    volumes:
      - .:/app

volumes:
  postgres_data: