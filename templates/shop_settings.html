<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Shop Settings</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body
        class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center p-6"
    >
        <div
            class="w-full max-w-lg bg-gray-900 rounded-2xl border border-gray-800 shadow-2xl overflow-hidden"
        >
            <div
                class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center"
            >
                <h1
                    class="text-xl font-bold uppercase tracking-widest text-blue-500"
                >
                    Shop Settings
                </h1>
                <a
                    href="/"
                    class="text-xs text-gray-400 font-bold uppercase hover:text-white"
                    >Back</a
                >
            </div>

            <form
                action="/update-shop-settings"
                method="post"
                class="p-6 space-y-4"
            >
                <div>
                    <label class="text-[10px] text-gray-500 uppercase font-bold"
                        >Shop Name</label
                    >
                    <input
                        type="text"
                        name="name"
                        value="{{ shop.name }}"
                        class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700 text-white font-bold"
                    />
                </div>

                <div>
                    <label class="text-[10px] text-gray-500 uppercase font-bold"
                        >Address (For Invoice)</label
                    >
                    <textarea
                        name="address"
                        rows="3"
                        class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700"
                    >
{{ shop.address }}</textarea
                    >
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label
                            class="text-[10px] text-gray-500 uppercase font-bold"
                            >Phone Number</label
                        >
                        <input
                            type="text"
                            name="phone"
                            value="{{ shop.phone }}"
                            class="w-full p-3 bg-gray-800 rounded-lg border border-gray-700"
                        />
                    </div>
                    <div>
                        <label
                            class="text-[10px] text-green-500 uppercase font-bold"
                            >Labor Rate ($/Hr)</label
                        >
                        <input
                            type="number"
                            step="0.01"
                            name="rate"
                            value="{{ shop.labor_rate }}"
                            class="w-full p-3 bg-gray-800 rounded-lg border border-green-900/50 text-green-400 font-mono font-bold"
                        />
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-black uppercase shadow-lg mt-4"
                >
                    Save Settings
                </button>
            </form>
        </div>
    </body>
</html>
