<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Customers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>input { font-size: 16px !important; }</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">

    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-10 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tighter text-blue-500 italic">
                <a href="/" class="hover:opacity-80 transition-opacity">REPAIR<span class="text-white">ORDER</span></a>
            </h1>
            <a href="/" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest bg-gray-800 px-2 py-1 rounded">Close</a>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-md mx-auto w-full">
        <div class="flex items-center space-x-2 mb-6">
            <a href="/" class="text-blue-500 text-sm font-bold active:scale-95 transition-transform">← Back</a>
            <h2 class="text-xl font-black italic text-white uppercase">Manage <span class="text-blue-500">Customers</span></h2>
        </div>

        <form id="customerForm" class="bg-gray-900 p-6 rounded-2xl border border-gray-800 mb-8 space-y-4 shadow-2xl">
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Customer Name</label>
                <input type="text" name="name" required autocomplete="off" placeholder="e.g. Swift Transportation" 
                       class="w-full p-4 bg-gray-800 rounded-xl border border-gray-700 text-white outline-none focus:border-blue-500 transition-all">
            </div>
            <button type="submit" class="w-full bg-blue-600 p-4 rounded-xl font-black uppercase tracking-widest shadow-lg active:bg-blue-700 active:scale-95 transition-all">
                Add Customer
            </button>
        </form>

        <div class="space-y-2">
            <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1 mb-2">Saved Customers</h3>
            {% if customers %} 
                {% for customer in customers %}
                <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 flex justify-between items-center shadow-md">
                    <span class="font-bold text-lg text-white">{{ customer.name }}</span>
                    <span class="text-[10px] bg-gray-800 px-2 py-1 rounded text-gray-500 font-mono italic">ID: {{ customer.id }}</span>
                </div>
                {% endfor %} 
            {% else %}
                <div class="text-center py-10 border-2 border-dashed border-gray-800 rounded-2xl">
                    <p class="text-gray-600 italic">No customers added yet.</p>
                </div>
            {% endif %}
        </div>
    </main>

    <script>
        document.getElementById("customerForm").onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "SAVING...";

            const formData = new FormData(e.target);
            try {
                const response = await fetch("/add-customer", { method: "POST", body: formData });
                if (response.ok) {
                    location.reload();
                } else {
                    throw new Error();
                }
            } catch (err) {
                alert("Error adding customer.");
                btn.disabled = false;
                btn.innerText = originalText;
            }
        };
    </script>
</body>
</html>
